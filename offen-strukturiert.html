<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offen heisst nicht unstrukturiert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&display=swap">
<style>
:root{color-scheme:light}
html,body{margin:0;background:#faf9f5}
main{max-width:1280px;margin:0 auto;padding:16px}
svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" font-family="'Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif" role="img">
<title>N Verlauf mit Rückschlagspiel: Die Aufgabe verläuft von geschlossen über halboffen bis offen, gezeigt am Pingpongschläger nach Plan, am Schläger für ein Rückschlagspiel und am eigenen Spiel. Der Unterricht verläuft von wenig strukturiert bis strukturiert.</title>
<defs>
<!-- geschlossen: lückenlose Schritte, ein festes Ergebnis -->
<g id="p-zu">
<path d="M0,0 H170" stroke="#1c2924" stroke-width="2"/>
<circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#1c2924" stroke-width="2.5"/>
<g fill="#1c2924"><circle cx="28" cy="0" r="4.5"/><circle cx="56" cy="0" r="4.5"/><circle cx="84" cy="0" r="4.5"/><circle cx="112" cy="0" r="4.5"/><circle cx="140" cy="0" r="4.5"/></g>
<rect x="172" y="-12" width="24" height="24" rx="4" fill="#c4532a"/>
</g>
<!-- halboffen: einzelne Schritte fehlen, der Ergebnisraum ist etwas weiter -->
<g id="p-halb">
<rect x="146" y="-27" width="56" height="54" rx="15" fill="#c4532a" fill-opacity=".1" stroke="#c4532a" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round"/>
<path d="M0,0 H56" stroke="#1c2924" stroke-width="2"/>
<path d="M68,0 H104 M124,0 H160" fill="none" stroke="#1c2924" stroke-width="2.4" stroke-dasharray="0.1 8" stroke-linecap="round"/>
<circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#1c2924" stroke-width="2.5"/>
<g fill="#1c2924"><circle cx="28" cy="0" r="4.5"/><circle cx="56" cy="0" r="4.5"/><circle cx="114" cy="0" r="4.5"/></g>
</g>
<!-- offen: wenige Schritte, mehrere Wege in einen weiten Ergebnisraum -->
<g id="p-offen">
<rect x="92" y="-48" width="118" height="96" rx="22" fill="#c4532a" fill-opacity=".1" stroke="#c4532a" stroke-width="2.5" stroke-dasharray="9 7" stroke-linecap="round"/>
<path d="M0,0 H56" stroke="#1c2924" stroke-width="2"/>
<path d="M70,-5 C96,-9 112,-27 150,-27 M72,0 H160 M70,5 C96,9 112,27 150,27" fill="none" stroke="#1c2924" stroke-width="2.4" stroke-dasharray="0.1 8" stroke-linecap="round"/>
<circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#1c2924" stroke-width="2.5"/>
<g fill="#1c2924"><circle cx="28" cy="0" r="4.5"/><circle cx="56" cy="0" r="4.5"/></g>
</g>
</defs>
<rect width="1280" height="720" fill="#faf9f5"/>
<text x="56" y="62" font-size="32" fill="#1c2924" font-weight="700">Offen heisst nicht unstrukturiert</text>

<!-- Achsen als Skalen -->
<path d="M440,455 H1190 M440,455 V122" fill="none" stroke="#1c2924" stroke-width="3" stroke-linecap="round"/>
<polygon points="1190,444 1212,455 1190,466" fill="#1c2924"/>
<polygon points="429,122 440,100 451,122" fill="#1c2924"/>
<path d="M565,447 V463 M815,447 V463 M1065,447 V463 M432,200 H448 M432,295 H448 M432,390 H448" fill="none" stroke="#1c2924" stroke-width="2.5" stroke-linecap="round"/>
<text x="460" y="112" font-size="13" fill="#5e6a64" font-weight="700" letter-spacing="2">UNTERRICHT</text>
<text x="1190" y="436" font-size="13" fill="#5e6a64" font-weight="700" text-anchor="end" letter-spacing="2">AUFGABE</text>

<!-- y-Achse: Rahmen von gestrichelt bis durchgezogen -->
<rect x="330" y="170" width="90" height="60" rx="8" fill="#ffffff" stroke="#2b6f5a" stroke-width="3.5"/>
<rect x="330" y="265" width="90" height="60" rx="8" fill="none" stroke="#2b6f5a" stroke-opacity=".7" stroke-width="3" stroke-dasharray="16 7" stroke-linecap="round"/>
<rect x="330" y="360" width="90" height="60" rx="8" fill="none" stroke="#9aa19b" stroke-width="2.5" stroke-dasharray="4 9" stroke-linecap="round"/>
<text x="315" y="196" font-size="22" fill="#1c2924" text-anchor="end">strukturiert</text>
<g font-size="17" fill="#5e6a64" text-anchor="end">
<text x="315" y="221">Inhalt klar gegliedert</text>
<text x="315" y="244">Ablauf geordnet</text>
<text x="315" y="267">ungestörtes Arbeiten</text>
</g>
<text x="315" y="397" font-size="22" fill="#1c2924" text-anchor="end">wenig strukturiert</text>
<g font-size="17" fill="#5e6a64" text-anchor="end">
<text x="315" y="422">für Schülerinnen und Schüler mit</text>
<text x="315" y="445">hoher intrinsischer Motivation</text>
<text x="315" y="468">Erfahrung im selbständigen Arbeiten</text>
<text x="315" y="491">Kenntnis des Designprozesses</text>
</g>

<!-- x-Achse: Linien der Aufgabe von geschlossen bis offen -->
<use xlink:href="#p-zu" transform="translate(487,510) scale(.8)"/>
<use xlink:href="#p-halb" transform="translate(734,510) scale(.8)"/>
<use xlink:href="#p-offen" transform="translate(981,510) scale(.8)"/>
<text x="565" y="582" font-size="22" fill="#1c2924" text-anchor="middle">geschlossen</text>
<text x="815" y="582" font-size="22" fill="#1c2924" text-anchor="middle">halboffen</text>
<text x="1065" y="582" font-size="22" fill="#1c2924" text-anchor="middle">offen</text>

<!-- dieselbe Aufgabe auf drei Stufen: was ist vorgegeben, was ist frei -->
<g font-size="12" fill="#5e6a64" font-weight="700" text-anchor="end" letter-spacing="1.5">
<text x="432" y="610">BEISPIEL</text>
<text x="432" y="634">VORGEGEBEN</text>
<text x="432" y="658">EIGENER ANTEIL</text>
</g>
<g font-size="16" fill="#1c2924" text-anchor="middle">
<text x="565" y="611">Pingpongschläger nach Plan</text>
<text x="815" y="611">Schläger für ein Rückschlagspiel</text>
<text x="1065" y="611">eigenes Spiel entwickeln</text>
</g>
<g font-size="16" fill="#5e6a64" text-anchor="middle">
<text x="565" y="635">Form, Material, Schritte</text>
<text x="815" y="635">Material, Grösse</text>
<text x="1065" y="635">Thema Spiele</text>
<text x="565" y="659">nur die Herstellung</text>
<text x="815" y="659">Form, Griff, Aufbau, Spielobjekt</text>
<text x="1065" y="659">Produkt, Material</text>
</g>
<text x="56" y="702" font-size="11.5" fill="#5e6a64">Stufen der Offenheit nach Käser &amp; Stuber (2020, S. 193-204), Offenheit und Struktur nach Stettler (2025, S. 76-86). Beispiele und Angaben zu «wenig strukturiert»: eigene Ergänzung.</text>
</svg>
</main>
</body>
</html>
